name: Deploy loading screen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # В артефакт попадает только сам сайт, без README, аддона и .git.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R index.html css js assets _site/
          touch _site/.nojekyll

      # Версия в ссылках на css, js, шрифты и фото: после пуша клиент скачает
      # новые файлы, даже если старый HTML ещё лежит в кэше.
      - name: Stamp asset versions
        env:
          SITE_VERSION: ${{ github.sha }}
        run: node scripts/stamp-assets.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
